; Runtime code loads these content roots by string paths with no hard
; references (HUDStatics widgets, ST_Game/DA_StoryRegistry/DA_Realm_*/Data/
; Techniques data assets, AudioSubsystem/EncounterDirector/AIController cues,
; VFXCueComponent materials, Character/SwordComponent/EnemyCatalog meshes,
; anims and montages, Character CDO input actions), so nothing else pulls
; them into the cook graph.
+DirectoriesToAlwaysCook=(Path="Qinglan/UI")
+DirectoriesToAlwaysCook=(Path="Qinglan/Data")
+DirectoriesToAlwaysCook=(Path="Qinglan/Input")
+DirectoriesToAlwaysCook=(Path="Qinglan/Characters")
+DirectoriesToAlwaysCook=(Path="Qinglan/Materials")
+DirectoriesToAlwaysCook=(Path="Qinglan/Audio")
; Audio also stages as UFS so loose source files ride the pak alongside the
; cooked packages.
+DirectoriesToAlwaysStageAsUFS=(Path="/Game/Qinglan/Audio")
; AUD-48 culture staging lives in DefaultGame.ini under the same
; [/Script/UnrealEd.ProjectPackagingSettings] section: UProjectPackagingSettings
; is declared config=Game, so only the Game config hierarchy is read by the
; editor/UAT (the settings above are pre-existing and unchanged).

