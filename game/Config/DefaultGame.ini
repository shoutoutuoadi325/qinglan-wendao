[Internationalization]
; AUD-48: the shipped runtime translations are baked into the cooked
; /Game/Qinglan/Data/DT_Localization asset and registered by
; FQinglanLocalizationService, so playback does not require .locres files.
; This path is reserved for an optional future engine localization target
; (gather/compile); adding it now keeps the engine locres loader configured.
+LocalizationPaths=%GAMEDIR%Content/Localization/Qinglan

[/Script/UnrealEd.ProjectPackagingSettings]
; AUD-48: UProjectPackagingSettings is config=Game, so these must live in the
; Game hierarchy (UAT and the editor both read this section). EFIGSCJK is the
; smallest engine ICU preset containing zh-Hans culture data alongside
; English; only the two declared ActiveLocales are actually staged.
InternationalizationPreset=EFIGSCJK
+CulturesToStage=en-US
+CulturesToStage=zh-Hans
; AUD-48: DT_Localization is loaded by soft path at boot, so it has no hard
; reference pulling it into the cook graph. The Game-hierarchy entry here is
; authoritative for UProjectPackagingSettings (config=Game); it also covers
; ST_Game and the other string-path data assets.
+DirectoriesToAlwaysCook=(Path="Qinglan/Data")

