[Internationalization]
; AUD-48: the shipped runtime translations are baked into the cooked
; /Game/Qinglan/Data/DT_Localization asset and registered by
; FQinglanLocalizationService, so playback does not require .locres files.
; This path is reserved for an optional future engine localization target
; (gather/compile); adding it now keeps the engine locres loader configured.
+LocalizationPaths=%GAMEDIR%Content/Localization/Qinglan

[/Script/UnrealEd.ProjectPackagingSettings]
; AUD-48: UProjectPackagingSettings is config=Game, so these must live in the
; Game hierarchy (UAT and the editor both read this section). EFIGSCJK is the
; smallest engine ICU preset containing zh-Hans culture data alongside
; English; only the two declared ActiveLocales are actually staged.
InternationalizationPreset=EFIGSCJK
+CulturesToStage=en-US
+CulturesToStage=zh-Hans
; AUD-48/53: these packages are loaded by runtime string paths (soft paths,
; FindObject/StaticLoadObject, or data-asset string ids), so they have no hard
; reference pulling them into the cook graph. UProjectPackagingSettings is
; config=Game, so this section is authoritative; entries in DefaultEngine.ini
; are not read. Cook every shipped asset directory, not only Data: the
; previous package inventory was missing UI widgets, Knight/monster meshes,
; montages, and audio (AUD-53).
+DirectoriesToAlwaysCook=(Path="Qinglan/Data")
+DirectoriesToAlwaysCook=(Path="Qinglan/UI")
+DirectoriesToAlwaysCook=(Path="Qinglan/Input")
+DirectoriesToAlwaysCook=(Path="Qinglan/Characters")
+DirectoriesToAlwaysCook=(Path="Qinglan/Materials")
+DirectoriesToAlwaysCook=(Path="Qinglan/Textures")
+DirectoriesToAlwaysCook=(Path="Qinglan/Audio")
+DirectoriesToAlwaysCook=(Path="Qinglan/Environments")
+DirectoriesToAlwaysCook=(Path="Qinglan/Weapons")
; AUD-53: map cooking is part of the same config=Game section; the copies in
; DefaultEngine.ini are not read, which left only the boot map in the package.
+MapsToCook=(FilePath="/Game/Qinglan/Maps/L_Hub")
+MapsToCook=(FilePath="/Game/Qinglan/Maps/L_BambooHollow")
+MapsToCook=(FilePath="/Game/Qinglan/Maps/L_AshenVerge")
+MapsToCook=(FilePath="/Game/Qinglan/Maps/L_TribulationArena")

